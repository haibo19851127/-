<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- 示例占位图 1：Three.js 线框 3D 场景示意（工程蓝图风） -->
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#080b10"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg1)"/>
  <!-- 透视网格地面 -->
  <g stroke="#4a88c8" stroke-width="1" opacity="0.35">
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="330" x2="800" y2="330"/>
    <line x1="0" y1="365" x2="800" y2="365"/>
    <line x1="0" y1="405" x2="800" y2="405"/>
    <line x1="100" y1="300" x2="20" y2="450"/>
    <line x1="260" y1="300" x2="220" y2="450"/>
    <line x1="420" y1="300" x2="420" y2="450"/>
    <line x1="580" y1="300" x2="640" y2="450"/>
    <line x1="720" y1="300" x2="800" y2="450"/>
  </g>
  <!-- 线框立方体 -->
  <g stroke="#7fb2e6" stroke-width="2" fill="none">
    <rect x="150" y="120" width="150" height="150"/>
    <rect x="195" y="85" width="150" height="150"/>
    <line x1="150" y1="120" x2="195" y2="85"/>
    <line x1="300" y1="120" x2="345" y2="85"/>
    <line x1="150" y1="270" x2="195" y2="235"/>
    <line x1="300" y1="270" x2="345" y2="235"/>
  </g>
  <!-- 线框圆环 -->
  <g stroke="#4a88c8" stroke-width="1.6" fill="none" opacity="0.9">
    <ellipse cx="540" cy="180" rx="120" ry="48"/>
    <ellipse cx="540" cy="180" rx="120" ry="48" transform="rotate(60 540 180)"/>
    <ellipse cx="540" cy="180" rx="120" ry="48" transform="rotate(120 540 180)"/>
  </g>
  <text x="32" y="410" fill="#8fa3b8" font-family="Consolas, monospace" font-size="16" letter-spacing="2">SAMPLE // WIREFRAME SCENE</text>
  <text x="32" y="56" fill="#4a88c8" font-family="Consolas, monospace" font-size="15" letter-spacing="3">THREE.JS · GRID · BOX · TORUS</text>
</svg>
